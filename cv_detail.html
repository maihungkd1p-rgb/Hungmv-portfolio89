    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            height: 56px;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            z-index: 10;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .badge {
            background: #0284c7;
            color: #ffffff;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .title-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            white-space: nowrap;
        }
        .btn-back {
            background: #334155;
            color: #ffffff;
        }
        .btn-back:hover {
            background: #475569;
        }
        .btn-download {
            background: #0284c7;
            color: #ffffff;
        }
        .btn-download:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }

        /* Mobile Notice Bar */
        .mobile-banner {
            display: none;
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 0.82rem;
            flex-shrink: 0;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .mobile-banner-text {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.35;
        }
        .mobile-banner-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #0284c7;
            color: #ffffff;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.78rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .pdf-viewer-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            background: #334155;
            position: relative;
        }
        iframe, object, embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .pdf-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .pdf-fallback h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .pdf-fallback p {
            color: #94a3b8;
            margin-bottom: 16px;
            max-width: 500px;
        }

        @media (max-width: 768px) {
            .mobile-banner {
                display: flex;
            }
            .title-text {
                display: none;
            }
            .topbar-left::after {
                content: "Mai Văn Hưng — CV Chi Tiết";
                font-size: 0.88rem;
                font-weight: 700;
                color: #ffffff;
            }
            .btn span:last-child {
                display: none;
            }
            .btn {
                padding: 8px 10px;
                min-width: 38px;
            }
        }

        @media (min-width: 480px) and (max-width: 768px) {
            .btn span:last-child {
                display: inline;
            }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="badge">Bản Gốc PDF</span>
            <span class="title-text">MAI VĂN HƯNG — QUẢN LÝ KINH DOANH KHU VỰC | QUẢN LÝ VẬN HÀNH</span>
        </div>
        <div class="topbar-actions">

                <span>⬇</span>
                <span>Tải PDF Gốc</span>
            </a>
        </div>
    </header>

    <!-- MOBILE DIRECT ACTION BANNER -->
    <div class="mobile-banner">
        <div class="mobile-banner-text">
            <span>📱 <strong>Thiết bị di động:</strong> Mở trực tiếp để xem đầy đủ các trang không bị giới hạn iframe.</span>
        </div>
        <a href="assets/images/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" target="_blank" class="mobile-banner-btn">
            <span>↗ Mở Toàn Màn Hình</span>
        </a>
    </div>

    <!-- NATIVE FULLSCREEN PDF VIEWER -->
    <main class="pdf-viewer-container">
        <object data="assets/images/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf#toolbar=1&navpanes=0" type="application/pdf" width="100%" height="100%">
            <iframe src="assets/images/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" type="application/pdf">
                <div class="pdf-fallback">
                    <h3>📄 Hồ Sơ CV Gốc — Mai Văn Hưng</h3>
                    <p>Trình duyệt của bạn đang bật chế độ bảo mật hoặc không hỗ trợ đọc trực tiếp trong khung.</p>
                    <a href="assets/images/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" target="_blank" class="btn btn-download">
                        <span>↗ Mở Trực Tiếp Trên Tab Mới</span>
                    </a>
                </div>
            </iframe>
        </object>
    </main>

</body>
</html>
